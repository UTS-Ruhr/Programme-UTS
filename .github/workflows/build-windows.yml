name: Windows-Build (Rechnungsscanner .exe)

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tesseract-OCR installieren (fuer den Bundle)
        run: |
          $ErrorActionPreference = "Stop"
          choco install tesseract -y
        shell: pwsh

      - name: Tesseract-Ordner lokalisieren und fuer den Bundle vorbereiten
        run: |
          $ErrorActionPreference = "Stop"

          $tesseractDir = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tesseractDir\tesseract.exe")) {
            $cmd = Get-Command tesseract.exe -ErrorAction SilentlyContinue
            if ($cmd) { $tesseractDir = Split-Path $cmd.Source }
          }
          if (-not (Test-Path "$tesseractDir\tesseract.exe")) {
            Write-Error "tesseract.exe wurde nach der Choco-Installation nirgends gefunden."
          }
          Write-Host "Tesseract gefunden unter: $tesseractDir"

          New-Item -ItemType Directory -Force -Path "vendor" | Out-Null
          Copy-Item -Path $tesseractDir -Destination "vendor\tesseract" -Recurse

          # Deutsches Sprachpaket sicherstellen (Choco-Paket bringt nur Englisch mit).
          New-Item -ItemType Directory -Force -Path "vendor\tesseract\tessdata" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/deu.traineddata" -OutFile "vendor\tesseract\tessdata\deu.traineddata"
        shell: pwsh

      - name: Python-Abhaengigkeiten installieren
        run: |
          $ErrorActionPreference = "Stop"
          pip install -r requirements-dev.txt
        shell: pwsh

      - name: .exe bauen (inkl. eingebautem Tesseract)
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller rechnungsscanner.spec
        shell: pwsh

      - name: Eingebettetes Tesseract im Build pruefen
        run: |
          $ErrorActionPreference = "Stop"
          $bundled = Get-ChildItem -Path "dist\Rechnungsscanner" -Recurse -Filter "tesseract.exe" -ErrorAction SilentlyContinue
          if (-not $bundled) {
            Write-Error "Build enthaelt kein eingebettetes tesseract.exe - Bundle ist fehlerhaft."
          }
          Write-Host "Eingebettetes Tesseract im Build gefunden: $($bundled.FullName)"
        shell: pwsh

      - name: Tests ausfuehren
        run: |
          $ErrorActionPreference = "Stop"
          pytest
        shell: pwsh

      - name: Build als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Rechnungsscanner-Windows
          path: dist/Rechnungsscanner/
          retention-days: 30
